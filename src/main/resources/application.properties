spring.application.name=RoomFlow
server.port=${SERVER_PORT:8080}

spring.main.banner-mode=off

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

spring.datasource.url=jdbc:postgresql://localhost:5435/${POSTGRES_DB:roomflow_db}
spring.datasource.username=${POSTGRES_USER:myuser}
spring.datasource.password=${POSTGRES_PASSWORD:fialka}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

auth.refresh.cookie-name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}
auth.refresh.cookie-path=${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
auth.refresh.cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
auth.refresh.cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
auth.refresh.cleanup.cron=${AUTH_REFRESH_CLEANUP_CRON:0 0 * * * *}
auth.refresh.cleanup.revoked-retention-days=${AUTH_REFRESH_REVOKED_RETENTION_DAYS:7}

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method

storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
storage.s3.bucket=${S3_BUCKET:roomflow-files}
storage.s3.presign-ttl-minutes=${S3_PRESIGN_TTL_MINUTES:15}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

holiday.api.base-url=${HOLIDAY_API_BASE_URL:https://date.nager.at}
holiday.api.timeout-ms=${HOLIDAY_API_TIMEOUT_MS:1000}
holiday.api.default-country=${HOLIDAY_DEFAULT_COUNTRY:RU}

resilience4j.retry.instances.holidayApi.max-attempts=2
resilience4j.retry.instances.holidayApi.wait-duration=500ms
resilience4j.circuitbreaker.instances.holidayApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.holidayApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.holidayApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.holidayApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.holidayApi.wait-duration-in-open-state=30s

resilience4j.ratelimiter.instances.holidayApi.limit-for-period=10
resilience4j.ratelimiter.instances.holidayApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.holidayApi.timeout-duration=0
resilience4j.retry.instances.holidayApi.ignore-exceptions=io.github.resilience4j.ratelimiter.RequestNotPermitted,org.springframework.web.client.HttpClientErrorException

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework
