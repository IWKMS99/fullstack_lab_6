name: RoomFlow CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Node.js for public HTML assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build public HTML assets
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build, test, and analyze with Gradle
        run: ./gradlew check --info

      - name: Upload analysis reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            build/reports/tests/
            build/reports/pmd/
            build/reports/spotbugs/

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: ./frontend
        run: npm run test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  production-containers:
    needs: [build-and-analyze, frontend-check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated test credentials
        run: python3 scripts/init_env.py
      - name: Build and start production containers
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up --build -d --wait
      - name: Exercise real database, authentication and object storage
        run: python3 scripts/smoke.py
      - name: Build Render image
        run: docker build -f Dockerfile.render -t roomflow-render:test .
      - name: Validate Render runtime with the free-tier memory limit
        run: python3 scripts/render_check.py --image roomflow-render:test --port 18088
      - name: Container diagnostics
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --tail=100
      - name: Stop test containers
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down
